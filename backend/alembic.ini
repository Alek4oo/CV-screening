# Alembic configuration. Target database: PostgreSQL.
#
#   cd backend
#   alembic upgrade head                       # apply the schema
#   alembic revision --autogenerate -m "..."   # new migration from the models
#
# Kept ASCII on purpose: configparser reads this file in the system locale
# encoding, so non-ASCII here breaks alembic on a cp1252 Windows shell.
#
# There is deliberately no sqlalchemy.url below: the connection comes from
# DATABASE_URL via alembic/env.py. One source of truth, and no passwords in git.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# File names carry the date, so `ls` shows the migrations in order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
