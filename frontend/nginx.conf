server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Хешираните имена на Vite правят тези файлове неизменими.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router е на History API — всеки път, който не е файл, се обслужва
    # от index.html, иначе презареждане на /roles/<id> дава 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
